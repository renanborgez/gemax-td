<?xml version="1.0" encoding="UTF-8"?>
<!--
  GeMax TD — square mark.
  Bold geometric "G" letterform doubling as tower silhouette: stroke-based
  G with rounded corners (=tower walls, turret cap, balcony tongue) plus a
  mint antenna mast + pulse dot rising from the top of the letter.
  Brand palette: cyan #44EEFF, mint #7AFCC9.
  Master is 1024x1024 — render down for app-icon / adaptive foreground.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Subtle vertical gradient behind mark -->
    <linearGradient id="bgGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#1A1D24"/>
      <stop offset="100%" stop-color="#0E1014"/>
    </linearGradient>

    <!-- G letterform fill: mint top -> cyan bottom -->
    <linearGradient id="gFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#7AFCC9"/>
      <stop offset="100%" stop-color="#44EEFF"/>
    </linearGradient>

    <!-- Antenna pulse halo -->
    <radialGradient id="pulseGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#7AFCC9" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#7AFCC9" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background plate (rounded square) -->
  <rect x="0" y="0" width="1024" height="1024" rx="180" ry="180" fill="url(#bgGlow)"/>

  <!--
    "G" letterform — single open path stroked with bold rounded line.
    Coords: letter bounds 320..704 x, 288..736 y; corner radius 120;
    stroke 120 (so visual edges run ~228..796 y, ~260..764 x).
    Tongue ends at canvas center (512, 552) — slightly below mid for classic G.
  -->
  <path d="M 704 408
           Q 704 288 584 288
           L 440 288
           Q 320 288 320 408
           L 320 616
           Q 320 736 440 736
           L 584 736
           Q 704 736 704 616
           L 704 552
           L 512 552"
        fill="none"
        stroke="url(#gFill)"
        stroke-width="120"
        stroke-linejoin="round"
        stroke-linecap="round"/>

  <!-- Antenna mast + pulse (mint accent) rising from top of "G" -->
  <line x1="512" y1="228" x2="512" y2="152"
        stroke="#7AFCC9" stroke-width="20" stroke-linecap="round"/>
  <circle cx="512" cy="124" r="56" fill="url(#pulseGlow)"/>
  <circle cx="512" cy="124" r="22" fill="#7AFCC9"/>
  <circle cx="512" cy="124" r="8"  fill="#F2F4F7"/>
</svg>
