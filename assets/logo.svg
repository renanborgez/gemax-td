<?xml version="1.0" encoding="UTF-8"?>
<!--
  GeMax TD — full lockup (mark + wordmark).
  Horizontal layout for splash / web header. Mark left, wordmark right.
  Wordmark: "GeMax" textPrimary, "TD" mint secondary — matches TitleScreen.tsx.
  Typography: Space Grotesk Bold (brand headline). If unavailable, falls
  back to system sans-serif via the generic family stack.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 480" width="1600" height="480">
  <defs>
    <linearGradient id="gFillH" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#7AFCC9"/>
      <stop offset="100%" stop-color="#44EEFF"/>
    </linearGradient>
    <radialGradient id="pulseGlowH" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#7AFCC9" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#7AFCC9" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Transparent background; consumers paint #0E1014 underneath -->

  <!-- Mark cluster (1024 master scaled into 480x480 box at left) -->
  <g transform="translate(0 0) scale(0.469)">
    <!-- "G" letterform stroke (mint -> cyan vertical gradient) -->
    <path d="M 704 408
             Q 704 288 584 288
             L 440 288
             Q 320 288 320 408
             L 320 616
             Q 320 736 440 736
             L 584 736
             Q 704 736 704 616
             L 704 552
             L 512 552"
          fill="none"
          stroke="url(#gFillH)"
          stroke-width="120"
          stroke-linejoin="round"
          stroke-linecap="round"/>

    <!-- Antenna mast + pulse rising from top of "G" -->
    <line x1="512" y1="228" x2="512" y2="152"
          stroke="#7AFCC9" stroke-width="20" stroke-linecap="round"/>
    <circle cx="512" cy="124" r="56" fill="url(#pulseGlowH)"/>
    <circle cx="512" cy="124" r="22" fill="#7AFCC9"/>
    <circle cx="512" cy="124" r="8"  fill="#F2F4F7"/>
  </g>

  <!-- Vertical divider -->
  <line x1="500" y1="120" x2="500" y2="360" stroke="#2A2E37" stroke-width="2"/>
  <circle cx="500" cy="240" r="5" fill="#44EEFF"/>

  <!-- Wordmark -->
  <g transform="translate(540 0)">
    <!-- Section label -->
    <text x="0" y="170"
          font-family="'Space Grotesk', 'SpaceGrotesk_500Medium', system-ui, sans-serif"
          font-weight="500" font-size="22" letter-spacing="6"
          fill="#8A8F99">CYBER-DEFENSE LOGIC</text>

    <!-- "GeMax TD" -->
    <text x="0" y="290"
          font-family="'Space Grotesk', 'SpaceGrotesk_700Bold', system-ui, sans-serif"
          font-weight="700" font-size="140" letter-spacing="-3">
      <tspan fill="#F2F4F7">GeMax </tspan><tspan fill="#7AFCC9">TD</tspan>
    </text>

    <!-- Tagline divider -->
    <g transform="translate(0 320)">
      <circle cx="6" cy="0" r="6" fill="#44EEFF"/>
      <line x1="20" y1="0" x2="900" y2="0" stroke="#2A2E37" stroke-width="1"/>
    </g>

    <text x="0" y="370"
          font-family="'Epilogue', 'Epilogue_400Regular', system-ui, sans-serif"
          font-weight="400" font-size="22" letter-spacing="2"
          fill="#8A8F99">DEFEND THE SUBNET · DEPLOY THE STACK</text>
  </g>
</svg>
